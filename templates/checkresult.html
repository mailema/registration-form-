<!DOCTYPE html>
<html>
    <head>
        <title>result</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <style>
           body{
               min-width:100vw;
               min-height:100dvh;
               background-color:aliceblue;
               box-sizing:border-box;
               display:flex;
               flex-direction:column;
               align-items:center;
           }
           label{
               display:block;
               margin-top:20px
           }
           .container{
               background-color:white;
               display:flex;
               flex-direction:column;
               justify-content:center;
               align-items:center;
               border-radius:20px;
               padding-left:5px;
               padding-right:5px;
               padding-top:20px;
               padding-bottom:30px;
               font-size:clamp(18px,5vw,25px);
          }
         
         
          .home{
              width:clamp(200px,90vw,600px);
              display:flex;
              justify-content:space-between;
              margin-top:10px;
              padding-right:clamp(30px,7vw,50px);
              padding-left:clamp(30px,7vw,50px);
              font-size:clamp(18px,5vw,25px);
              box-sizing:border-box;
              margin-top:20px
          }
          a{
              color:green
          }
          table,tr,th,td{
              border:2px solid green;
              border-collapse:collapse;
              padding:7px
          }
          th{
              color:green
          }
        </style>
    </head>
    <body>
        <div class="home">
            <a href="/home">Home</a>
            <a href="/check">Check</a>
        </div>
        <div class="container">
           <table>
               <tr>
                   <th><b>ID</b></th>
                   <th><b>NAME</b></th>
                   <th><b>EMAIL</b></th>
                   <th><b>PASSWORD</b></th>
               </tr>
               {% for row in rows %}
               <tr>
                   <td>{{ row[0] }}</td>
                   <td>{{ row[1] }}</td>
                   <td>{{ row[2] }}</td>
                   <td>{{ row[3] }}</td>
               </tr>
               {% endfor %}
           </table>
        </div>
    </body>
      </html>
