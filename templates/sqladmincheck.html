<!DOCTYPE html>
<html>
    <head>
        <title>welcome admin</title>
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <style>
           body{
               display:flex;
               flex-direction:column;
               justify-content:center;
               align-items:center;
               min-height:100dvh;
               background-color:aliceblue;
               box-sizing:border-box;
           }
           label{
               display:block;
               margin-top:20px
           }
           .container{
               background-color:white;
               width:clamp(200px,90vw,600px);
               height:clamp(200px,35dvh,300px);
               display:flex;
               flex-direction:column;
               justify-content:center;
               align-items:center;
               border-radius:20px;
               padding-top:20px;
               padding-bottom:30px;
               font-size:clamp(18px,5vw,25px);
              box-sizing:border-box;
              color:green
          }
         
         
          .home{
              width:clamp(200px,90vw,600px);
              display:flex;
              justify-content:space-between;
              position:fixed;
              top:10px;
              
              font-size:clamp(18px,5vw,25px);
              box-sizing:border-box;
          }
          a{
              color:green
          }
          .succeed{
              position:fixed;
              top:40px;
              background-color:white;
               width:clamp(200px,90vw,600px);
               display:flex;
               justify-content:center;
               align-items:center;
               font-size:clamp(18px,5vw,25px);
               color:green;
               border-radius:8px;
          }
          .fail{
              position:fixed;
              top:40px;
              background-color:white;
               width:clamp(200px,90vw,600px);
               display:flex;
               justify-content:center;
               align-items:center;
               font-size:clamp(18px,5vw,25px);
               color:red;
               border-radius:8px;
          }
          .nav{
              border:1px solid lightgreen;
              border-radius:10px;
              padding-left:clamp(20px,5vw,30px);
              padding-right:clamp(20px,5vw,30px);
              padding-bottom:10px;
              padding-top:10px;
              font-size:clamp(18px,5vw,25px)
          }
          .nav:hover{
              background-color:lightgreen;
              box-shadow: 0px 0px 10px green;
              color:white;
              transition:1s
          }
        </style>
    </head>
    <body>
        <div class="home">
            <a href="/home" class="nav">Home</a>
            <a href="/check" class="nav">Check</a>
        </div>
        {% for category,message in get_flashed_messages(with_categories=True) %}
        <div class="{{ category }}">
            <p>{{ message }}</p>
        </div>
        {% endfor %}
        <div class="container">
           <h2>WELCOME ADMIN🎊🎉</h2> 
        </div>
        
    </body>
</html>
